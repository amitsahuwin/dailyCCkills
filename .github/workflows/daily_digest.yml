name: Daily Claude Code Agent Digest

on:
  schedule:
    # Runs at 02:00 UTC every day (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write      # needed to commit digest file back to repo

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Run digest script ─────────────────────────────────────────────────
      - name: Fetch digest
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          chmod +x fetch_cc_digest.sh
          bash fetch_cc_digest.sh
          DIGEST_FILE=$(ls digest_*.md 2>/dev/null | sort | tail -1)
          echo "DIGEST_FILE=${DIGEST_FILE}" >> $GITHUB_ENV
          echo "Generated: ${DIGEST_FILE}"

      # ── 3. Commit digest file back to repo ──────────────────────────────────
      - name: Commit digest to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digest_*.md
          git diff --cached --quiet || git commit -m "chore: daily digest $(date +%Y-%m-%d)"
          git push

      # ── 4. Send email via Gmail SMTP ────────────────────────────────────────
      - name: Send digest email
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT:          amitsahuwin@gmail.com
          DIGEST_FILE:        ${{ env.DIGEST_FILE }}
        run: |
          python3 - <<'PYEOF'
          import os, smtplib, datetime, re, sys

          gmail_user  = os.environ.get("GMAIL_USER", "")
          gmail_pass  = os.environ.get("GMAIL_APP_PASSWORD", "")
          recipient   = os.environ.get("RECIPIENT", "")
          digest_file = os.environ.get("DIGEST_FILE", "")
          date_str    = datetime.date.today().isoformat()

          if not gmail_user or not gmail_pass:
              print("⚠️  GMAIL_USER or GMAIL_APP_PASSWORD secret not set — skipping email")
              sys.exit(0)

          # Read digest markdown
          try:
              with open(digest_file, "r") as f:
                  md_body = f.read()
          except Exception as e:
              md_body = f"⚠️ Could not read digest file: {e}"

          # Minimal markdown → HTML conversion
          html = md_body
          html = re.sub(r'^### (.+)$', r'<h3>\1</h3>', html, flags=re.MULTILINE)
          html = re.sub(r'^## (.+)$',  r'<h2>\1</h2>', html, flags=re.MULTILINE)
          html = re.sub(r'^# (.+)$',   r'<h1 style="color:#1a1a2e">\1</h1>', html, flags=re.MULTILINE)
          html = re.sub(r'\*\*(.+?)\*\*', r'<b>\1</b>', html)
          html = re.sub(r'\[([^\]]+)\]\(([^)]+)\)', r'<a href="\2">\1</a>', html)

          # Convert pipe tables to HTML tables
          lines = html.split('\n')
          out, in_table = [], False
          for line in lines:
              if line.strip().startswith('|'):
                  cells = [c.strip() for c in line.strip().strip('|').split('|')]
                  if all(set(c.replace(':', '').replace(' ', '')) <= set('-') for c in cells):
                      continue  # skip separator row
                  if not in_table:
                      out.append('<table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-size:13px;width:100%;margin:8px 0">')
                      in_table = True
                  out.append('<tr>' + ''.join(f'<td style="padding:6px">{c}</td>' for c in cells) + '</tr>')
              else:
                  if in_table:
                      out.append('</table>')
                      in_table = False
                  out.append(line if line.strip() else '<br>')
          if in_table:
              out.append('</table>')

          html_body = f"""<html><body style="font-family:Arial,sans-serif;max-width:960px;margin:auto;padding:20px;color:#222">
          {''.join(out)}
          </body></html>"""

          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          msg = MIMEMultipart('alternative')
          msg['Subject'] = f"🤖 Claude Code Agent Digest — {date_str}"
          msg['From']    = gmail_user
          msg['To']      = recipient
          msg.attach(MIMEText(md_body, 'plain'))
          msg.attach(MIMEText(html_body, 'html'))

          try:
              with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
                  server.login(gmail_user, gmail_pass)
                  server.sendmail(gmail_user, recipient, msg.as_string())
              print(f"✅ Email sent to {recipient}")
          except Exception as e:
              print(f"❌ Email failed: {e}")
              sys.exit(1)
          PYEOF
