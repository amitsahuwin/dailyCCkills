name: Daily Claude Code Agent Digest

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write      # needed to commit digest file back to repo

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Install deps ─────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get install -y curl python3 jq
          python3 --version

      # ── 3. Run digest script ─────────────────────────────────────────────────
      - name: Fetch digest
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          chmod +x fetch_cc_digest.sh
          bash fetch_cc_digest.sh
          echo "DIGEST_FILE=$(ls digest_*.md | sort | tail -1)" >> $GITHUB_ENV

      # ── 4. Commit digest file back to repo ──────────────────────────────────
      - name: Commit digest to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digest_*.md
          git diff --cached --quiet || git commit -m "chore: daily digest $(date +%Y-%m-%d)"
          git push

      # ── 5. Send email via Gmail SMTP ────────────────────────────────────────
      - name: Send digest email
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT:          amitsahuwin@gmail.com
          DIGEST_FILE:        ${{ env.DIGEST_FILE }}
        run: |
          python3 - <<'PYEOF'
          import os, smtplib, datetime
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          gmail_user = os.environ["GMAIL_USER"]
          gmail_pass = os.environ["GMAIL_APP_PASSWORD"]
          recipient  = os.environ["RECIPIENT"]
          digest_file = os.environ.get("DIGEST_FILE", "")
          date_str   = datetime.date.today().isoformat()

          # Read digest markdown
          try:
              with open(digest_file, "r") as f:
                  md_body = f.read()
          except Exception:
              md_body = "⚠️ Could not read digest file."

          # Convert markdown to simple HTML (tables + bold)
          import re
          html = md_body
          # Headers
          html = re.sub(r'^### (.+)$', r'<h3>\1</h3>', html, flags=re.MULTILINE)
          html = re.sub(r'^## (.+)$',  r'<h2>\1</h2>', html, flags=re.MULTILINE)
          html = re.sub(r'^# (.+)$',   r'<h1>\1</h1>', html, flags=re.MULTILINE)
          # Bold
          html = re.sub(r'\*\*(.+?)\*\*', r'<b>\1</b>', html)
          # Links
          html = re.sub(r'\[([^\]]+)\]\(([^)]+)\)', r'<a href="\2">\1</a>', html)
          # Table rows
          lines = html.split('\n')
          out, in_table = [], False
          for line in lines:
              if line.startswith('|'):
                  cells = [c.strip() for c in line.strip('|').split('|')]
                  if all(set(c.strip()) <= set('-: ') for c in cells):
                      continue  # skip separator row
                  if not in_table:
                      out.append('<table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;font-family:monospace;font-size:13px;width:100%">')
                      in_table = True
                  out.append('<tr>' + ''.join(f'<td>{c}</td>' for c in cells) + '</tr>')
              else:
                  if in_table:
                      out.append('</table>')
                      in_table = False
                  out.append(line)
          if in_table:
              out.append('</table>')
          html = '\n'.join(out)
          # Wrap in basic HTML
          html = f"""
          <html><body style="font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:20px">
          {html}
          </body></html>
          """

          msg = MIMEMultipart('alternative')
          msg['Subject'] = f"🤖 Claude Code Agent Digest — {date_str}"
          msg['From']    = gmail_user
          msg['To']      = recipient
          msg.attach(MIMEText(md_body, 'plain'))
          msg.attach(MIMEText(html, 'html'))

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(gmail_user, gmail_pass)
              server.sendmail(gmail_user, recipient, msg.as_string())
          print(f"✅ Email sent to {recipient}")
          PYEOF
